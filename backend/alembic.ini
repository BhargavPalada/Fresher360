# Alembic configuration for Fresher360 backend
# See https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# async URL is set dynamically in migrations/env.py from environment
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/fresher360

[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
